<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140e09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Kirim-Chiqim</title>
<style>
:root{--bg:#140e09;--card:#221710;--c2:#2d1f14;--line:#3b2a1c;--or:#ff7a1a;--or2:#ffa04d;--tx:#fff4ea;--mu:#b39a85;--in:#5be08c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 90px}
#app{max-width:560px;margin:auto;padding:14px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mn b{font-size:20px}.mn button{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--or2);font-size:22px}
.hero{background:linear-gradient(145deg,#ff8a2b,#e5530a);border-radius:26px;padding:20px;color:#2a1000;box-shadow:0 14px 34px #ff7a1a33}
.hero small{opacity:.75;font-weight:600}.hero h1{font-size:34px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.k small{color:var(--mu)}.k h2{font-size:21px;margin-top:4px}.in{color:var(--in)}.out{color:var(--or2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
input{width:100%;background:var(--c2);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;font:inherit;margin-bottom:8px}
input:focus{outline:2px solid var(--or)}
.row{display:flex;gap:8px}.row>*{flex:1}
button.p,button.g{border:0;border-radius:14px;padding:13px;font:600 16px system-ui;color:#2a1000;background:var(--or)}
button.g{background:var(--c2);color:var(--or2)}button.mic.on{background:#e5330a;color:#fff}
.day{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:16px 4px 6px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.it span{flex:1;word-break:break-word}.it em{font-style:normal;font-weight:700}.it a{color:var(--mu);padding:4px 8px}
.empty{color:var(--mu);text-align:center;padding:26px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#140e09ee;border-top:1px solid var(--line);backdrop-filter:blur(12px)}
nav button{flex:1;max-width:130px;border:0;border-radius:16px;background:none;color:var(--mu);padding:8px 2px;font:600 12px system-ui}
nav button i{display:block;font-style:normal;font-size:21px}nav button.a{background:var(--c2);color:var(--or2)}
.msg{color:var(--or2);font-size:14px;margin:6px 0}
#t{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--or);color:#2a1000;padding:10px 16px;border-radius:14px;font-weight:600;display:none;z-index:9}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px}
.mn button svg{margin:auto}.it a svg{width:18px;height:18px;display:block}.it span svg.mi{width:15px;height:15px;color:var(--or2);margin-right:5px;vertical-align:-2px}
button.p,button.g{display:flex;align-items:center;justify-content:center;gap:8px}
button.mic.on{animation:pl 1.1s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px #ff7a1a33}}
select{background:var(--c2);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;margin-bottom:8px;width:100%}
</style></head><body>
<div id="app"></div><div id="t"></div>
<nav id="nav"></nav>
<script>
// ===== BULUT SOZLAMASI: Firebase loyihangiz ma'lumotlarini shu yerga qo'ying (README.txt ga qarang) =====
const FB={apiKey:"",authDomain:"",projectId:"",appId:""};
// ==========================================================================================================
const $=s=>document.querySelector(s),MO=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktyabr','Noyabr','Dekabr'];
const p2=n=>String(n).padStart(2,'0'),td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const money=n=>Math.round(n).toLocaleString('ru-RU')+" so'm";
let S=JSON.parse(localStorage.kc||'{"e":[],"last":0,"mail":""}'),tab='home',cur=td().slice(0,7),user=null,fs=null,au=null,msg='',busy=0,tm,rec=null;
const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',out:'<path d="M7 17L17 7"/><path d="M8 7h9v9"/>',in:'<path d="M17 7L7 17"/><path d="M16 17H7V8"/>',acc:'<path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.6 1.5A3.3 3.3 0 0117 18z"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',l:'<path d="M15 5l-7 7 7 7"/>',r:'<path d="M9 5l7 7-7 7"/>',ok:'<path d="M5 12l5 5 9-10"/>'};
const ic=(n,c)=>`<svg viewBox="0 0 24 24"${c?` class="${c}"`:''}>${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function store(){localStorage.kc=JSON.stringify(S)}
function save(){store();render();clearTimeout(tm);tm=setTimeout(sync,1500)}
const list=t=>S.e.filter(x=>!x.d&&x.t==t&&x.dt.startsWith(cur));
const sum=t=>list(t).reduce((a,x)=>a+x.a,0);
function shift(n){let[y,m]=cur.split('-').map(Number);m+=n;if(m>12){m=1;y++}if(m<1){m=12;y--}cur=y+'-'+p2(m);render()}
function head(){const[y,m]=cur.split('-');return `<div class="mn"><button onclick="shift(-1)">${ic('l')}</button><b>${MO[m-1]} ${y}</b><button onclick="shift(1)">${ic('r')}</button></div>`}
function items(l){if(!l.length)return '<div class="empty">Bu oyda yozuv yo\'q. Pastdan qo\'shing.</div>';
const g={};l.forEach(x=>(g[x.dt]=g[x.dt]||[]).push(x));
return Object.keys(g).sort().reverse().map(d=>{const a=g[d].sort((p,q)=>q.u-p.u);return `<div class="day"><span>${+d.slice(8)}-${MO[+d.slice(5,7)-1].toLowerCase()}${d==td()?' (bugun)':''}</span><span>${money(a.reduce((s,x)=>s+x.a,0))}</span></div>`+a.map(x=>`<div class="it"><span>${x.v?ic('mic','mi'):''}${esc(x.n||(x.t=='in'?'Kirim':'Chiqim'))}</span><em class="${x.t=='in'?'in':'out'}">${x.t=='in'?'+':'−'}${money(x.a)}</em><a onclick="del('${x.id}')">${ic('x')}</a></div>`).join('')}).join('')}
function form(t){return `<div class="card"><input id="amt" inputmode="numeric" placeholder="Summa (so'm)"><input id="note" placeholder="${t=='out'?'Nima uchun? (non, benzin...)':'Qayerdan? (ish haqi, savdo...)'}"><input id="dt" type="date" value="${td()}"><select onchange="S.lang=this.value;store()" aria-label="Ovoz tili"><option value="uz-UZ"${S.lang=='uz-UZ'||!S.lang?' selected':''}>Ovoz tili: O'zbekcha</option><option value="ru-RU"${S.lang=='ru-RU'?' selected':''}>Ovoz tili: Ruscha</option><option value="en-US"${S.lang=='en-US'?' selected':''}>Ovoz tili: Inglizcha</option></select><div class="row"><button class="g mic" id="mic" onclick="voice()">${ic('mic')}<span>Ovoz</span></button><button class="p" onclick="add('${t}')">${ic('ok')}<span>Saqlash</span></button></div></div>`}
function render(){
const nv=[['home','home','Bosh'],['out','out','Chiqim'],['in','in','Kirim'],['acc','acc','Hisob']];
$('#nav').innerHTML=nv.map(([k,i,n])=>`<button class="${tab==k?'a':''}" onclick="tab='${k}';render()">${ic(i)}${n}</button>`).join('');
let h='';
if(tab=='home'){const i=sum('in'),o=sum('out'),b=i-o,tdo=S.e.filter(x=>!x.d&&x.t=='out'&&x.dt==td()).reduce((a,x)=>a+x.a,0);
h=head()+`<div class="hero"><small>Oy balansi</small><h1>${b<0?'−':''}${money(Math.abs(b))}</h1></div><div class="two"><div class="k"><small>Kirim</small><h2 class="in">${money(i)}</h2></div><div class="k"><small>Chiqim</small><h2 class="out">${money(o)}</h2></div></div><div class="k"><small>Bugungi chiqim</small><h2 class="out">${money(tdo)}</h2></div>`+items(list('in').concat(list('out')).sort((a,b)=>b.u-a.u).slice(0,6))}
else if(tab=='out'||tab=='in'){h=head()+form(tab)+`<div class="k"><small>${tab=='out'?'Oylik chiqim':'Oylik kirim'}</small><h2 class="${tab}">${money(sum(tab))}</h2></div>`+items(list(tab))}
else{const on=user||S.mail;h=`<div class="card"><h2>Bulutli saqlash</h2><p class="msg" style="color:var(--mu)">Email bilan kirsangiz, ma'lumotlar internetda saqlanadi. Telefon almashsa, shu email bilan kiring — hammasi tiklanadi.</p>`+
(!FB.apiKey?`<p class="msg">Bulut hali sozlanmagan (README.txt). Hozircha ma'lumotlar shu telefonda saqlanadi.</p>`:
user?`<p style="display:flex;gap:8px;align-items:center"><span class="in">${ic('ok')}</span>${esc(user.email)}</p><p class="msg" style="color:var(--mu)">Oxirgi sinxronlash: ${S.last?new Date(S.last).toLocaleString('ru-RU'):'hali yo\'q'}</p><div class="row"><button class="p" onclick="sync()">Hozir sinxronlash</button><button class="g" onclick="au.signOut()">Chiqish</button></div>`:
`<input id="em" type="email" placeholder="Email" value="${esc(S.mail)}"><input id="pw" type="password" placeholder="Parol (kamida 6 belgi)"><div class="row"><button class="p" onclick="auth(0)">Kirish</button><button class="g" onclick="auth(1)">Ro'yxatdan o'tish</button></div>`)+
`<p class="msg">${esc(msg)}</p></div><div class="card"><b>Holat</b><p class="msg" style="color:var(--mu)">${navigator.onLine?'Internet bor':'Internet yo\'q — ishlayveradi, keyin sinxronlanadi'}. Jami yozuvlar: ${S.e.filter(x=>!x.d).length}</p></div>`}
$('#app').innerHTML=h}
function add(t){const a=parseInt(String($('#amt').value).replace(/\D/g,''));if(!a)return toast('Summani kiriting');
S.e.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,a,n:$('#note').value.trim(),dt:$('#dt').value||td(),v:$('#note').dataset.v?1:0,u:Date.now()});
cur=(S.e[S.e.length-1].dt).slice(0,7);save();toast('Saqlandi ✓')}
function del(id){if(!confirm("O'chirilsinmi?"))return;const x=S.e.find(e=>e.id==id);x.d=1;x.u=Date.now();save()}
function parseV(t){const m=t.match(/\d[\d ]*/);if(!m)return 0;let n=parseInt(m[0].replace(/ /g,'')),r=t.slice(m.index+m[0].length).trim().toLowerCase();
if(/^(ming|минг)/.test(r))n*=1000;else if(/^(mln|million|миллион)/.test(r))n*=1e6;return n}
function micUI(on){const m=$('#mic');if(!m)return;m.classList.toggle('on',on);m.innerHTML=ic(on?'stop':'mic')+'<span>'+(on?'Tinglayapman':'Ovoz')+'</span>'}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R)return toast("Bu oynada ovoz ishlamaydi. Chrome brauzerda oching yoki klaviaturadagi mikrofon tugmasidan foydalaning");
if(rec){rec.stop();return}
if(!navigator.onLine)return toast("Ovoz uchun internet kerak. Klaviaturadagi mikrofon tugmasini ishlating");
const r=rec=new R();let got='';r.lang=S.lang||'uz-UZ';r.interimResults=true;r.continuous=false;micUI(1);
r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;got=t;$('#note').value=t;$('#note').dataset.v=1;const n=parseV(t);if(n)$('#amt').value=n};
r.onerror=e=>toast(({'not-allowed':'Mikrofonga ruxsat bering (brauzer sozlamalari)','service-not-allowed':'Mikrofonga ruxsat bering','no-speech':'Ovoz eshitilmadi, qayta urining','network':'Ovoz uchun internet kerak','language-not-supported':"Bu til qo'llanmaydi, tilni o'zgartiring",'audio-capture':'Mikrofon topilmadi'})[e.error]||'Ovoz xatosi: '+e.error);
r.onend=()=>{rec=null;micUI(0);if(got)toast('Tekshirib, Saqlash ni bosing')};
try{r.start()}catch(x){rec=null;micUI(0);toast("Ovozni boshlab bo'lmadi: "+x.message)}}
// ===== bulut =====
const ld=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.append(s)});
async function fbInit(){if(!FB.apiKey||fs||!navigator.onLine)return;try{const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';for(const n of['app','auth','firestore'])await ld(b+n+'-compat.js');
firebase.initializeApp(FB);au=firebase.auth();fs=firebase.firestore();au.onAuthStateChanged(u=>{user=u;if(u){S.mail=u.email;store();sync()}render()})}catch(e){}}
async function auth(reg){const e=$('#em').value.trim(),p=$('#pw').value;if(!fs)return toast('Internet kerak');
try{msg='';await(reg?au.createUserWithEmailAndPassword(e,p):au.signInWithEmailAndPassword(e,p))}catch(x){msg=({'auth/wrong-password':"Parol noto'g'ri",'auth/invalid-credential':"Email yoki parol noto'g'ri",'auth/email-already-in-use':"Bu email band — «Kirish» ni bosing",'auth/weak-password':'Parol kamida 6 belgi'})[x.code]||x.message;render()}}
async function sync(){if(!user||busy||!navigator.onLine)return;busy=1;
try{const c=fs.collection('users').doc(user.uid).collection('e'),sn=await c.get(),R={},L={},up=[];sn.forEach(d=>R[d.id]=d.data());S.e.forEach(x=>L[x.id]=x);
for(const k in R)if(!L[k]||R[k].u>L[k].u)L[k]=R[k];
for(const k in L)if(!R[k]||L[k].u>R[k].u)up.push(L[k]);
for(let i=0;i<up.length;i+=400){const b=fs.batch();up.slice(i,i+400).forEach(x=>b.set(c.doc(x.id),x));await b.commit()}
S.e=Object.values(L);S.last=Date.now();store();msg=''}catch(e){msg='Sinxronlash xatosi: '+e.message}
busy=0;if(!/INPUT/.test(document.activeElement.tagName))render()}
addEventListener('online',()=>{fbInit().then(sync);render()});addEventListener('offline',render);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();fbInit();
</script></body></html>
